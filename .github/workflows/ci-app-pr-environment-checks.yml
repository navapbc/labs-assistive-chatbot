name: CI app PR Environment Checks
on:
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      commit_hash:
        required: true
        type: string
  pull_request:

jobs:
  preflight:
    # Skip downstream jobs when the repo has no AWS backend config committed
    # (e.g. a freshly-templated copy). Once an adopter runs bin/create-tfbackend
    # and commits the resulting .s3.tfbackend files, these checks start running.
    name: Check infra is configured
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if ls infra/accounts/*.s3.tfbackend >/dev/null 2>&1 && [ -f infra/app/service/dev.s3.tfbackend ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping PR environment checks — no backend config files found. See infra/README.md to set up your AWS account."
          fi

  update:
    name: " " # GitHub UI is noisy when calling reusable workflows, so use whitespace for name to reduce noise
    needs: preflight
    uses: ./.github/workflows/pr-environment-checks.yml
    if: needs.preflight.outputs.configured == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.state == 'open')
    with:
      app_name: "app"
      environment: "dev"
      pr_number: ${{ inputs.pr_number || github.event.number }}
      commit_hash: ${{ inputs.commit_hash || github.event.pull_request.head.sha }}
