name: Build release image for scanning
description: |
  Build the app's release image and load it into the local Docker daemon,
  using the GitHub Actions cache so repeated builds in the same (or a later)
  run reuse layers instead of rebuilding from scratch.

inputs:
  app_name:
    required: true
    description: Name of the application folder (e.g. "app").

outputs:
  image:
    description: "Image reference (name:tag) of the built image."
    value: ${{ steps.image-ref.outputs.image }}

runs:
  using: "composite"
  steps:
    - name: Get image name and tag
      id: image-ref
      shell: bash
      run: |
        IMAGE_NAME=$(make APP_NAME=${{ inputs.app_name }} release-image-name)
        IMAGE_TAG=$(make release-image-tag)
        echo "image=$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
        # Same defaults the app Makefile uses for RUN_USER / RUN_UID
        echo "run_user=$(id -un)" >> "$GITHUB_OUTPUT"
        echo "run_uid=$(id -u)" >> "$GITHUB_OUTPUT"

    - uses: docker/setup-buildx-action@v3

    # Mirrors `make release-build` (see the app's Makefile), but with
    # cache-from/cache-to, which the Makefile target doesn't support
    - name: Build release image
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.app_name }}
        target: release
        platforms: linux/amd64
        build-args: |
          RUN_USER=${{ steps.image-ref.outputs.run_user }}
          RUN_UID=${{ steps.image-ref.outputs.run_uid }}
        tags: ${{ steps.image-ref.outputs.image }}
        load: true
        cache-from: type=gha,scope=vulnerability-scan-${{ inputs.app_name }}
        cache-to: type=gha,scope=vulnerability-scan-${{ inputs.app_name }}
