# Trivy secret scanning config (loaded via the TRIVY_SECRET_CONFIG lookup in
# .github/workflows/vulnerability-scans.yml).
# https://trivy.dev/latest/docs/scanner/secret/#configuration

allow-rules:
  # Third-party packages installed into the image's virtualenv. These contain
  # example/placeholder credentials in source and docstrings, not real secrets
  # (e.g. chainlit's GCS storage client and litellm's Slack webhook docstring).
  # App code under /app/src is still scanned.
  - id: python-site-packages
    description: skip installed third-party Python packages
    path: app/\.venv/lib/python[0-9.]+/site-packages/
